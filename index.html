<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aastha Creation</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff8f2;
}

.header{
    background:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    position:sticky;
    top:0;
}

.logo{
    width:50px;
    height:50px;
    border-radius:50%;
}

.search{
    flex:1;
    padding:12px;
    border:1px solid #ddd;
    border-radius:30px;
}

.banner{
    background:linear-gradient(135deg,#f7bfd0,#ffeef4);
    text-align:center;
    padding:40px 20px;
}

.banner h1{
    color:#e78ca8;
}

.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    padding:20px;
}

.cat{
    background:white;
    text-align:center;
    padding:15px;
    border-radius:15px;
    text-decoration:none;
    color:black;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.cat img{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:10px;
}
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}

}

.title{
    color:#e78ca8;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:10px;
    text-align: centre;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}

.price{
    color:#e78ca8;
    font-size:20px;
    font-weight:bold;
}

.btn{
    width:100%;
    padding:10px;
    background:#e78ca8;
    color:white;
    border:none;
    border-radius:10px;
}

.cart{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#e78ca8;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:50%;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:50px;
}
</style>
</head>

<body>
<div class="banner">
    <h1>Aastha Creation</h1>
    <p>Handmade Candles • Flowers • Aari Work</p>
</div>
<div class="header">
    <img src="logo.png" class="logo">
    <input type="text" id="searchBox" class="search"
placeholder="Search products..."
onkeyup="alert('working')"
</div>



<div class="categories">

    <a href="Candles.html" class="cat">
        <img src="IMG_20260602_192540_796.jpg">
        <h3>Candles</h3>
    </a>

    <a href="Flowers.html" class="cat">
        <img src="IMG_20260602_192459_653.jpg">
        <h3>Flowers</h3>
    </a>

    <a href="Aari.html" class="cat">
        <img src="IMG_20260602_193615_987.jpg">
        <h3>Aari Work</h3>
    </a>

</div>

<div class="products">

    <h2 class="title">Featured Products</h2>

    <div class="grid">

        <div class="card">
            <img src="IMG_20260602_192540_796.jpg">
            <h3>Rose Candle</h3>
            <p class="price">₹199</p>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="IMG_20260602_192459_653.jpg">
            <h3>Flower Bouquet</h3>
            <p class="price">₹299</p>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="IMG_20260602_193615_987.jpg">
            <h3>Aari Design</h3>
            <p class="price">₹499</p>
            <button class="btn">Add to Cart</button>
        </div>

    </div>

</div>

<a href="Cart.html" class="cart">🛒</a>

<a href="https://wa.me/YOURNUMBER" class="whatsapp">
WhatsApp
</a>
<script>
function searchProducts() {
    let input = document.getElementById("searchBox").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();

        if(text.includes(input)){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
                       </script>
</body>
    </html>
