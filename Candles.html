<!DOCTYPE html>
<html>
<head>
<title>Candle Collection</title>

<style>
body{
font-family:Arial,sans-serif;
background:#fff8f2;
padding:20px;
}

h1{
text-align:center;
color:#e78ca8;
}

.category{
margin-top:40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.price{
font-size:20px;
font-weight:bold;
color:#e78ca8;
margin:10px 0;
}

.btn{
background:#e78ca8;
color:white;
border:none;
padding:10px 20px;
border-radius:25px;
cursor:pointer;
}

.back{
display:inline-block;
margin-bottom:20px;
background:#e78ca8;
color:white;
padding:10px 20px;
border-radius:25px;
text-decoration:none;
}
</style>

</head>

<body>

<a href="index.html" class="back">← Back To Home</a>

<h1>🕯️ Candle Collection</h1>
<div class="category">

<h2>🌸 Flower Candles</h2>

<div class="products">

<div class="card">
<img src="mini-flower.jpg">
<h3>Mini Flower Candle</h3>
<p class="price">₹20</p>
<button class="btn">Add To Cart</button>
</div>

<div class="card">
<img src="lotus-flower.jpg">
<h3>Lotus Flower Candle</h3>
<p class="price">₹70</p>
<button class="btn">Add To Cart</button>
</div>

<div class="card">
<img src="sunflower.jpg">
<h3>Sunflower Candle</h3>
<p class="price">₹30</p>
<button class="btn">Add To Cart</button>
</div>

</div>

</div>
